<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 5 Meses Amor</title>
  <link rel="stylesheet" href="5_meses.css">
</head>
<body>
  <div class="container">
    <h1>FELIZ 5 MESES AMOR</h1>

    <div class="coracoes">
      <img src="download__1_-removebg-preview.png" alt="Coração">
      <img src="download__1_-removebg-preview.png" alt="Coração">
      <img src="download__1_-removebg-preview.png" alt="Coração">
      <img src="download__1_-removebg-preview.png" alt="Coração">
    </div>

    <div class="fotos">
      <img src="IMG-20250406-WA0000.jpg" alt="Foto 1">
      <img src="IMG-20250216-WA0002.jpg" alt="Foto 2">
      <img src="IMG-20250127-WA0009.jpg" alt="Foto 3">
      <img src="IMG-20250101-WA0015.jpg" alt="Foto 4">
    </div>
  </div>

  <p class="mensagem" id="mensagem"></p>

  <button class="botao-fofo">Você é o amor da minha vida 💘</button>
</div>

<!-- Música de fundo -->
<audio autoplay loop>
  <source src="musica.mp3" type="audio/mpeg">
  Seu navegador não suporta áudio.
</audio>

<script>
  // Efeito de digitação
  const texto = "Eu te amo a cada dia mais 💖";
  let i = 0;
  const mensagem = document.getElementById("mensagem");

  function digitar() {
    if (i < texto.length) {
      mensagem.innerHTML += texto.charAt(i);
      i++;
      setTimeout(digitar, 100);
    }
  }

  digitar();
</script>
</body>
</html>
